<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>极致图片压缩工具</title>
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <style>
        :root { --primary: #007AFF; --success: #34C759; --bg: #F2F2F7; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 600px; width: 100%; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); box-sizing: border-box; }
        h1 { font-size: 20px; text-align: center; color: #1c1c1e; margin: 10px 0 5px 0; }
        .subtitle { text-align: center; color: #8e8e93; font-size: 12px; margin-bottom: 20px; }
        
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .settings-card { background: #f8f8fa; border-radius: 12px; padding: 10px; border: 1px solid #eee; display: flex; flex-direction: column; gap: 5px; }
        .settings-card label { font-size: 11px; font-weight: 600; color: #8e8e93; text-transform: uppercase; }
        .settings-card select { background: white; border: 1px solid #ddd; padding: 8px; border-radius: 8px; font-size: 14px; color: var(--primary); outline: none; }

        .btn { border: none; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; text-decoration: none; }
        .btn-download-all { background: var(--success); color: white; width: 100%; padding: 14px; border-radius: 12px; font-size: 16px; margin-bottom: 15px; display: none; }
        
        .upload-area { border: 2px dashed #d1d1d6; border-radius: 15px; padding: 25px; text-align: center; cursor: pointer; margin-bottom: 15px; background: #fff; }
        
        #resultList { width: 100%; }
        .item { background: #fff; border: 1px solid #efeff4; border-radius: 12px; padding: 10px; margin-bottom: 8px; display: flex; align-items: center; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .preview-img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; margin-right: 12px; background: #eee; flex-shrink: 0; }
        .info { flex: 1; min-width: 0; margin-right: 10px; }
        .name { font-size: 13px; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
        .status { font-size: 11px; color: #8e8e93; margin-top: 3px; }
        .btn-single-save { background: #fff; color: var(--primary); border: 1.5px solid var(--primary); padding: 6px 12px; border-radius: 8px; font-size: 12px; display: none; }
        
        .loading-icon { display: inline-block; width: 10px; height: 10px; border: 2px solid #ccc; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-right: 5px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .notice { font-size: 11px; color: #ff9500; background: #fff9e6; padding: 8px; border-radius: 8px; margin-top: 10px; display: none; border: 1px solid #ffeeba; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1>极致图片压缩</h1>
    <div class="subtitle">强制 JPG · 智能降质 · 纯本地处理</div>

    <div class="settings-grid">
        <div class="settings-card">
            <label>目标大小限制</label>
            <select id="sizeLimit">
                <option value="0.02">20 KB (极小)</option>
                <option value="0.05">50 KB (极小)</option>
                <option value="0.1" selected>100 KB (推荐)</option>
                <option value="0.5">500 KB</option>
                <option value="1">1.0 MB</option>
            </select>
        </div>
        <div class="settings-card">
            <label>强制输出格式</label>
            <select id="formatSelect">
                <option value="image/jpeg">JPG 格式</option>
                <option value="image/webp">WebP 格式</option>
            </select>
        </div>
    </div>
    
    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        <span style="font-size: 30px;">📉</span>
        <p style="margin: 5px 0; color: #666; font-size: 14px;">点击批量上传图片</p>
    </div>
    <input type="file" id="fileInput" accept="image/*,image/heic,image/heif" multiple style="display:none">

    <button id="downloadAllBtn" class="btn btn-download-all">保存全部图片</button>
    
    <div id="multiNotice" class="notice">
        💡 提示：下载多张时请点击“允许”
    </div>

    <div id="resultList"></div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const resultList = document.getElementById('resultList');
    const downloadAllBtn = document.getElementById('downloadAllBtn');
    const multiNotice = document.getElementById('multiNotice');
    const sizeLimitSelect = document.getElementById('sizeLimit');
    const formatSelect = document.getElementById('formatSelect');
    
    let readyLinks = []; 

    fileInput.onchange = async (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        const targetSizeMB = parseFloat(sizeLimitSelect.value);
        const targetFormat = formatSelect.value;

        for (const file of files) {
            const item = document.createElement('div');
            item.className = 'item';
            item.innerHTML = `
                <img class="preview-img" src="">
                <div class="info">
                    <div class="name">${file.name}</div>
                    <div class="status"><span class="loading-icon"></span>处理中...</div>
                </div>
                <a class="btn btn-single-save">保存</a>
            `;
            resultList.prepend(item);
            
            const statusText = item.querySelector('.status');
            const previewImg = item.querySelector('.preview-img');
            const singleBtn = item.querySelector('.btn-single-save');

            try {
                let fileToProcess = file;

                // 1. HEIC 解码
                if (file.name.toLowerCase().endsWith('.heic') || file.type === 'image/heic') {
                    statusText.innerHTML = `<span class="loading-icon"></span>解码HEIC...`;
                    const blob = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.8 });
                    fileToProcess = Array.isArray(blob) ? blob[0] : blob;
                }

                // 2. 极致压缩策略
                // 如果目标小于 0.2MB，自动缩小最大分辨率，否则 JPG 无法达到这么小的体积
                let maxDimension = 4096;
                if (targetSizeMB <= 0.05) maxDimension = 1024;
                else if (targetSizeMB <= 0.1) maxDimension = 1600;
                else if (targetSizeMB <= 0.2) maxDimension = 2048;

                statusText.innerHTML = `<span class="loading-icon"></span>正在压至${targetSizeMB*1000}KB...`;
                
                const options = {
                    maxSizeMB: targetSizeMB,
                    maxWidthOrHeight: maxDimension,
                    useWebWorker: true,
                    fileType: targetFormat,
                    initialQuality: targetSizeMB < 0.1 ? 0.6 : 0.8
                };

                const compressedBlob = await imageCompression(fileToProcess, options);
                
                // 3. 生成结果
                const url = URL.createObjectURL(compressedBlob);
                const ext = targetFormat === 'image/jpeg' ? 'jpg' : 'webp';
                const finalName = file.name.replace(/\.[^/.]+$/, "") + "." + ext;
                readyLinks.push({ url, name: finalName });

                // 4. 更新UI
                previewImg.src = url;
                const actualSizeKB = (compressedBlob.size/1024).toFixed(1);
                statusText.innerHTML = `✅ 已压至 ${actualSizeKB} KB / JPG`;
                statusText.style.color = '#34C759';
                
                singleBtn.href = url;
                singleBtn.download = finalName;
                singleBtn.style.display = 'block';

                if (readyLinks.length > 0) {
                    downloadAllBtn.style.display = 'flex';
                    if (readyLinks.length > 1) multiNotice.style.display = 'block';
                }

            } catch (error) {
                console.error(error);
                statusText.innerText = '❌ 压缩失败';
                statusText.style.color = '#FF3B30';
            }
        }
        fileInput.value = '';
    };

    downloadAllBtn.onclick = () => {
        readyLinks.forEach((item, index) => {
            setTimeout(() => {
                const a = document.createElement('a');
                a.href = item.url;
                a.download = item.name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }, index * 400); 
        });
    };
</script>

</body>
</html>
