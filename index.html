<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全格式图片压缩转码 (支持HEIC)</title>
    <!-- 引入核心库：压缩库 + HEIC解码库 -->
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <style>
        :root { --primary: #007AFF; --bg: #F2F2F7; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 600px; width: 100%; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { font-size: 24px; text-align: center; color: #1c1c1e; margin-bottom: 10px; }
        p { text-align: center; color: #8e8e93; font-size: 14px; margin-bottom: 25px; }
        .upload-area { border: 2px dashed #d1d1d6; border-radius: 15px; padding: 40px 20px; text-align: center; cursor: pointer; transition: 0.3s; margin-bottom: 20px;}
        .upload-area:hover { border-color: var(--primary); background: #f0f7ff; }
        #fileInput { display: none; }
        .btn { background: var(--primary); color: white; padding: 14px 25px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; width: 100%; font-size: 16px; }
        #resultList { width: 100%; }
        .item { background: #fafafa; border-radius: 12px; padding: 15px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #efeff4; }
        .info { flex: 1; margin-right: 10px; overflow: hidden; }
        .name { font-size: 14px; color: #3a3a3c; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .status { font-size: 12px; color: #8e8e93; margin-top: 4px; }
        .download-link { color: var(--primary); text-decoration: none; font-weight: 600; font-size: 14px; border: 1px solid var(--primary); padding: 6px 14px; border-radius: 8px; white-space: nowrap; }
        .loading-icon { display: inline-block; width: 12px; height: 12px; border: 2px solid #ccc; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-right: 5px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h1>图片全格式转换压缩</h1>
    <p>支持 iPhone HEIC · 转为 JPG · 限制 2MB</p>
    
    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        <span style="font-size: 40px;">📸</span>
        <p style="margin: 10px 0; color: #666;">点击选择或多选图片<br>(支持 HEIC/PNG/JPG)</p>
        <button class="btn">选择文件</button>
    </div>
    <input type="file" id="fileInput" accept="image/*,image/heic,image/heif" multiple>

    <div id="resultList"></div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const resultList = document.getElementById('resultList');

    fileInput.onchange = async (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        for (const file of files) {
            // 创建UI
            const item = document.createElement('div');
            item.className = 'item';
            item.innerHTML = `
                <div class="info">
                    <div class="name">${file.name}</div>
                    <div class="status"><span class="loading-icon"></span>正在准备...</div>
                </div>
            `;
            resultList.prepend(item);
            const statusText = item.querySelector('.status');

            try {
                let fileToProcess = file;

                // --- 步骤 1: 处理 HEIC 格式 ---
                if (file.name.toLowerCase().endsWith('.heic') || file.type === 'image/heic') {
                    statusText.innerHTML = `<span class="loading-icon"></span>正在解码 HEIC (可能较慢)...`;
                    const blob = await heic2any({
                        blob: file,
                        toType: "image/jpeg",
                        quality: 0.8
                    });
                    // heic2any 可能返回数组，取第一个
                    fileToProcess = Array.isArray(blob) ? blob[0] : blob;
                }

                // --- 步骤 2: 压缩并转码 ---
                statusText.innerHTML = `<span class="loading-icon"></span>正在压缩至 2MB...`;
                const options = {
                    maxSizeMB: 2,
                    maxWidthOrHeight: 4000,
                    useWebWorker: true,
                    fileType: 'image/jpeg'
                };

                const compressedFile = await imageCompression(fileToProcess, options);
                
                // --- 步骤 3: 产出结果 ---
                const url = URL.createObjectURL(compressedFile);
                const sizeMB = (compressedFile.size / (1024 * 1024)).toFixed(2);
                
                statusText.innerHTML = `处理完成 (大小: ${sizeMB} MB)`;
                statusText.style.color = '#34C759';
                
                const dl = document.createElement('a');
                dl.className = 'download-link';
                dl.href = url;
                dl.download = `compressed_${file.name.replace(/\.[^/.]+$/, "")}.jpg`;
                dl.innerText = '保存 JPG';
                item.appendChild(dl);

            } catch (error) {
                console.error(error);
                statusText.innerText = '处理失败，请重试';
                statusText.style.color = '#FF3B30';
            }
        }
        fileInput.value = '';
    };
</script>

</body>
</html>
