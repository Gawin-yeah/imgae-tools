<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极速图片压缩转码工具</title>
    <!-- 引入压缩核心库 -->
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <style>
        :root { --primary: #007AFF; --bg: #F2F2F7; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 600px; width: 100%; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { font-size: 24px; text-align: center; color: #1c1c1e; margin-bottom: 10px; }
        p { text-align: center; color: #8e8e93; font-size: 14px; margin-bottom: 25px; }
        
        /* 按钮与输入框样式 */
        .upload-area { border: 2px dashed #d1d1d6; border-radius: 15px; padding: 40px 20px; text-align: center; cursor: pointer; transition: 0.3s; }
        .upload-area:hover { border-color: var(--primary); background: #f0f7ff; }
        #fileInput { display: none; }
        .btn { background: var(--primary); color: white; padding: 12px 25px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; width: 100%; font-size: 16px; }
        
        /* 列表样式 */
        #resultList { margin-top: 25px; width: 100%; }
        .item { background: #fafafa; border-radius: 12px; padding: 15px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #efeff4; }
        .info { flex: 1; margin-right: 10px; }
        .name { font-size: 14px; color: #3a3a3c; font-weight: 500; word-break: break-all; }
        .status { font-size: 12px; color: #8e8e93; margin-top: 4px; }
        .download-link { color: var(--primary); text-decoration: none; font-weight: 600; font-size: 14px; border: 1px solid var(--primary); padding: 5px 12px; border-radius: 6px; }
        
        /* 适配手机端 */
        @media (max-width: 480px) {
            padding: 15px;
            h1 { font-size: 20px; }
            .item { flex-direction: column; align-items: flex-start; }
            .download-link { margin-top: 10px; display: inline-block; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>图片转码压缩</h1>
    <p>转为 JPG · 限制 2MB · 批量处理 · 纯本地</p>
    
    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        <span style="font-size: 40px;">📸</span>
        <p style="margin: 10px 0;">点击或拖拽图片到这里</p>
        <button class="btn">选择文件</button>
    </div>
    <input type="file" id="fileInput" accept="image/*" multiple>

    <div id="resultList"></div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const resultList = document.getElementById('resultList');

    fileInput.onchange = async (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        for (const file of files) {
            // 1. 创建UI条目
            const item = document.createElement('div');
            item.className = 'item';
            item.innerHTML = `
                <div class="info">
                    <div class="name">${file.name}</div>
                    <div class="status">处理中...</div>
                </div>
            `;
            resultList.prepend(item);

            try {
                // 2. 压缩配置
                const options = {
                    maxSizeMB: 2,           // 目标最大 2MB
                    maxWidthOrHeight: 4096, // 保持高分辨率
                    useWebWorker: true,     // 开启多线程防止UI卡死
                    fileType: 'image/jpeg', // 强制转码为 JPG
                    initialQuality: 0.8     // 初始质量
                };

                // 3. 执行压缩
                const compressedFile = await imageCompression(file, options);
                
                // 4. 更新UI为下载链接
                const url = URL.createObjectURL(compressedFile);
                const sizeKB = (compressedFile.size / 1024).toFixed(0);
                const sizeDisplay = sizeKB > 1024 ? (sizeKB/1024).toFixed(2) + ' MB' : sizeKB + ' KB';
                
                item.querySelector('.status').innerHTML = `完成 (目标: <2MB, 实际: ${sizeDisplay})`;
                item.querySelector('.status').style.color = '#34C759';
                
                const dl = document.createElement('a');
                dl.className = 'download-link';
                dl.href = url;
                dl.download = `compressed_${file.name.split('.')[0]}.jpg`;
                dl.innerText = '保存图片';
                item.appendChild(dl);

            } catch (error) {
                console.error(error);
                item.querySelector('.status').innerText = '处理失败';
                item.querySelector('.status').style.color = '#FF3B30';
            }
        }
        // 处理完清空输入框，方便下次选择
        fileInput.value = '';
    };
</script>

</body>
</html>
